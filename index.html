<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocGen — Dokumentumkezelő</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/registry.css">
  <link rel="stylesheet" href="vendor/client-picker.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" class="bev-sprite" style="position:absolute;overflow:hidden" aria-hidden="true">
    <symbol id="ic-tab-docgen" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M6 3h8l4 4v14H6z"/>
      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M14 3v4h4"/>
      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M9 12h6M9 15.5h6M9 8.5h2"/>
    </symbol>
    <symbol id="ic-tab-registry" viewBox="0 0 24 24">
      <circle cx="9" cy="8.5" r="3.1" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M3.5 19c0-3 2.5-4.8 5.5-4.8s5.5 1.8 5.5 4.8"/>
      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M17 9.5h4M17 13h4M17 16.5h3"/>
    </symbol>
    <symbol id="ic-tab-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8"/>
    </symbol>
  </svg>

  <div class="app-root">

    <!-- Header -->
    <header class="app-header">
      <div class="app-logo">
        <svg class="app-logo__mark" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="4" y="3" width="19" height="26" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M9 10h9M9 15h9M9 20h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="24" cy="23" r="6" fill="var(--bg, #fff)" stroke="currentColor" stroke-width="1.8"/>
          <path d="M21.5 23.2l1.9 1.9 3.4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="app-logo__text">DocGen <span class="app-logo__sub">Dokumentumkezelő</span></span>
      </div>
      <div id="header-breadcrumb" class="header-breadcrumb">
        <span class="header-bc-item muted">Nincs adat betöltve</span>
      </div>
      <div class="header-user">
        <span id="header-username" class="muted"></span>
      </div>
    </header>

    <!-- Tab navigáció -->
    <nav class="tab-nav">
      <button class="tab-btn active" type="button" data-tab="docgen" accesskey="1">
        <svg class="tab-btn__icon" width="18" height="18" aria-hidden="true"><use href="#ic-tab-docgen"/></svg>
        <span>Dokumentumok</span>
      </button>
      <button class="tab-btn" type="button" data-tab="registry" accesskey="2">
        <svg class="tab-btn__icon" width="18" height="18" aria-hidden="true"><use href="#ic-tab-registry"/></svg>
        <span>Nyilvántartás</span>
      </button>
      <button class="tab-btn" type="button" data-tab="settings" accesskey="3">
        <svg class="tab-btn__icon" width="18" height="18" aria-hidden="true"><use href="#ic-tab-settings"/></svg>
        <span>Beállítások</span>
      </button>
    </nav>

    <!-- Tab tartalmak -->
    <div id="tab-docgen"   class="tab-content active"></div>
    <div id="tab-registry" class="tab-content"></div>
    <div id="tab-settings" class="tab-content"></div>

  </div>

  <div id="toast-container"></div>
  <div id="dialog-overlay" class="dialog-overlay hidden"></div>

  <!-- Vendor -->
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/client-picker.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/pizzip.min.js"></script>
  <script src="vendor/docxtemplater.js"></script>
  <script src="vendor/FileSaver.min.js"></script>
  <script src="vendor/exceljs.min.js"></script>

  <!-- Naplózás -->
  <script src="js/logger.js"></script>

  <!-- Service réteg -->
  <script src="js/services/settings-service.js"></script>
  <script src="js/services/fs-service.js"></script>
  <script src="js/services/excel-service.js"></script>
  <script src="js/services/docx-service.js"></script>
  <script src="js/services/employee-repo.js"></script>
  <script src="js/services/xlsx-write.js"></script>
  <script src="js/services/xlsx-read.js"></script>

  <!-- Séma-réteg (a séma adat, nem kód – lásd js/schema/seed-schema.js) -->
  <script src="js/schema/value-codec.js"></script>
  <script src="js/schema/seed-schema.js"></script>
  <script src="js/schema/schema-store.js"></script>
  <script src="js/schema/schema-from-xlsx.js"></script>
  <script src="js/schema/export-profiles.js"></script>

  <!-- Megosztott segédfüggvények -->
  <script src="js/utils.js"></script>

  <!-- Modulok -->
  <!-- Dokumentumgenerálás: alegységek a mag előtt töltődnek -->
  <script src="js/modules/docgen/missing-log.js"></script>
  <script src="js/modules/docgen/naming.js"></script>
  <script src="js/modules/docgen/merge.js"></script>
  <script src="js/modules/docgen/groups.js"></script>
  <script src="js/modules/docgen.js"></script>
  <script src="js/modules/registry/employee-form.js"></script>
  <script src="js/modules/registry/xlsx-io.js"></script>
  <script src="js/modules/registry/registry-view.js"></script>
  <script src="js/modules/settings/settings-view.js"></script>

  <!-- App shell -->
  <script src="js/app.js"></script>
</body>
</html>
