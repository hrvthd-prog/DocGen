<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>DocGen – Nyomtatás</title>
  <style>
    :root {
      --ui-sans: "Segoe UI Variable Text", "Segoe UI", system-ui, Arial, sans-serif;
      --doc-serif: "Times New Roman", Georgia, serif;
    }

    @media screen {
      body { font-family: var(--ui-sans); padding: 20px; background: #F0F7F6; }
      .print-info {
        background: #fff; border: 1px solid #C6DFDB; border-radius: 10px;
        padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
      }
      .print-info button {
        padding: 7px 16px; border: none; border-radius: 8px; cursor: pointer;
        font-size: 13px; font-family: inherit; font-weight: 500;
      }
      .print-info button:first-of-type { background: #21474f; color: #fff; }
      .print-info button:last-of-type  { background: #E4EFED; color: #1A3238; }
      #doc-content {
        background: #fff; border: 1px solid #C6DFDB; border-radius: 10px;
        padding: 28px 34px; max-width: 820px; margin: 0 auto;
      }
    }

    /* A Word-dokumentum tartalmának alapformázása – a mammoth csak nyers HTML-t
       ad vissza, stílus nélkül. Ez nem pótolja a Word tördelését, de olvasható
       és nyomtatható eredményt ad. */
    #doc-content {
      font-family: var(--doc-serif);
      font-size: 11.5pt;
      line-height: 1.45;
      color: #000;
    }
    #doc-content p { margin: 0 0 8pt; }
    #doc-content h1, #doc-content h2, #doc-content h3 {
      font-family: var(--doc-serif); margin: 14pt 0 6pt; line-height: 1.25;
    }
    #doc-content h1 { font-size: 15pt; }
    #doc-content h2 { font-size: 13pt; }
    #doc-content h3 { font-size: 12pt; }
    #doc-content table { border-collapse: collapse; width: 100%; margin: 8pt 0 12pt; }
    #doc-content td, #doc-content th {
      border: 1px solid #000; padding: 4pt 6pt; vertical-align: top; font-size: 10.5pt;
    }
    #doc-content td p, #doc-content th p { margin: 0; }
    #doc-content ul, #doc-content ol { margin: 0 0 8pt 18pt; }
    #doc-content img { max-width: 100%; height: auto; }

    @page { size: A4; margin: 20mm 18mm; }

    @media print {
      .print-info { display: none !important; }
      body { padding: 0; background: #fff; }
      #doc-content { border: none; padding: 0; max-width: none; }
      #doc-content table, #doc-content tr, #doc-content img { page-break-inside: avoid; }
      #doc-content h1, #doc-content h2, #doc-content h3 { page-break-after: avoid; }
    }
  </style>
</head>
<body>
  <div class="print-info">
    <span style="flex:1;font-size:13px;color:#6E9298">
      A nyomtatási párbeszédben válaszd a „Mentés PDF-ként” célt.
      Pontos tördelést igénylő iratnál a Wordből mentett PDF a megbízható út.
    </span>
    <button onclick="window.print()">Nyomtatás / PDF mentés</button>
    <button onclick="window.close()">Bezárás</button>
  </div>
  <div id="doc-content"></div>

  <script src="vendor/mammoth.browser.min.js?v=10.44"></script>
  <script>
    'use strict';
    const out = document.getElementById('doc-content');
    const stored = sessionStorage.getItem('docgen_print_data');
    if (stored) {
      try {
        const { b64, filename } = JSON.parse(stored);
        sessionStorage.removeItem('docgen_print_data');
        document.title = filename || 'DocGen – Nyomtatás';
        const bin = atob(b64);
        const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        mammoth.convertToHtml({ arrayBuffer: buf.buffer }).then(res => {
          out.innerHTML = res.value;
          setTimeout(() => window.print(), 400);
        }).catch(e => {
          out.innerHTML = '<p style="color:#B00">A dokumentum megjelenítése nem sikerült: ' + e.message + '</p>';
        });
      } catch (e) {
        out.innerHTML = '<p style="color:#B00">A nyomtatási adat beolvasása nem sikerült: ' + e.message + '</p>';
      }
    } else {
      out.innerHTML = '<p style="color:#6E9298">Nincs megjeleníthető dokumentum. Ez az oldal generálás után nyílik meg automatikusan.</p>';
    }
  </script>
</body>
</html>
